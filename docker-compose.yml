services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parse_xml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parse_xml"]
      interval: 5s
      timeout: 5s
      retries: 10

  trixi_parse_xml:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs